name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: energy_test
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U energy -d energy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE: Host=localhost;Database=energy_test;Username=energy;Password=test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx
      - run: docker build -t energy-trading:ci .
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
